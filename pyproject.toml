[project]
name = "churnlab"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "numpy~=1.26.0",
    "scikit-learn",
]

[project.optional-dependencies]
tensorflow = ["tensorflow"]
kubeflow = ["kfp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]
